<article class="article-card">
  <a class="card-image" href="{% url 'news:detail' article.slug %}" aria-label="Leer {{ article.title }}">
    {% if article.featured_image %}
      <img src="{{ article.featured_image.url }}" alt="{{ article.title }}" loading="lazy">
    {% else %}<span class="image-placeholder">CAMPUS / NOTICIAS</span>{% endif %}
  </a>
  <div class="card-content">
    <div class="tags">{% for item in article.categories.all %}<a href="{% url 'news:category' item.slug %}">{{ item.name }}</a>{% endfor %}</div>
    <h2><a href="{% url 'news:detail' article.slug %}">{{ article.title }}</a></h2>
    <p>{{ article.summary|truncatewords:24 }}</p>
    <div class="meta">{{ article.author.name }} · {{ article.published_at|date:"d M Y" }}</div>
    <a class="read-more" href="{% url 'news:detail' article.slug %}">Leer noticia <span aria-hidden="true">→</span></a>
  </div>
</article>
